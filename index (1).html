<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>party animals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&display=swap" rel="stylesheet">
<style>
/* Brand is dark-only by design: black ground, magenta + purple. No light theme. */
:root{
  --black:#000000; --magenta:#DF40C6; --purple:#8C51F6; --line:rgba(223,64,198,.25);
  --nav-h:84px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;height:100%;background:#000;color:var(--magenta);
  font-family:'Unbounded','Arial Black',system-ui,sans-serif;font-weight:400;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.on-purple:focus-visible{outline-color:#000}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#000}

/* header */
.hdr{position:absolute;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:0 16px;
  background:linear-gradient(#000 70%,rgba(0,0,0,0))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:16px;letter-spacing:-.03em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;border:2px solid var(--purple);
  background:#000;color:var(--purple);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.pill.mag{border-color:var(--magenta);color:var(--magenta)}

/* screens */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:72px 16px calc(var(--nav-h) + 44px)}
.screen h1{font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
#screen-map{padding:0;overflow:hidden}

/* buttons (design system) */
.btn{min-width:180px;max-width:100%;height:52px;padding:0 28px;border:2px solid var(--magenta);border-radius:999px;
  background:var(--magenta);color:#000;font-size:14px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:active{border-color:var(--purple);background:var(--purple)}
.btn.sec{background:#000;color:var(--magenta)}
.btn.sec:active{border-color:var(--purple);color:var(--purple);background:#000}
.btn.dark{background:#000;border-color:#000;color:var(--magenta)}
.btn.dark[aria-pressed="true"]{background:var(--magenta);color:#000;border-color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.small{height:40px;min-width:0;padding:0 18px;font-size:12px}

/* input field */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field label{font-size:12px}
.field .box{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border:2px solid var(--purple);border-radius:28px;background:#000}
.field .box:focus-within{border-color:var(--magenta);box-shadow:0 0 0 4px rgba(223,64,198,.3)}
.field input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;color:var(--magenta);font-size:14px;outline:none}
.field input::placeholder{color:var(--purple);opacity:1}
.field .clr{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--purple);background:#000;color:var(--purple);
  font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}

/* list item */
.li{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 20px 12px 12px;border:1px solid var(--line);
  border-radius:36px;background:#000;color:var(--magenta);text-align:left;cursor:pointer}
.li .ic{width:48px;height:48px;flex:none;border-radius:24px;background:#000;border:2px solid var(--purple);display:grid;place-items:center}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.li .tx b{font-size:15px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx small{font-size:12px;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li[aria-current="true"]{background:var(--magenta);border-color:var(--magenta);color:#000}
.li[aria-current="true"] .ic{border-color:#000}
.li[aria-current="true"] .tx small{color:#000}
.li[aria-current="true"]:focus-visible{outline-color:#000}
.li:disabled{opacity:.4;cursor:not-allowed}
#vlist{display:flex;flex-direction:column;gap:12px}

/* card (design system) */
.card{position:relative;background:var(--purple);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px;color:#000}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:#000;color:var(--magenta);font-size:12px;font-weight:800;white-space:nowrap}
.card h3{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.card .sub{font-size:13px;margin-top:6px}
.card .meta{font-size:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .note{font-size:11px}
.card .x{position:absolute;top:-14px;right:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--magenta);background:#000;
  color:var(--magenta);font-size:20px;font-weight:800;cursor:pointer;display:grid;place-items:center;padding:0}

/* panels */
.panel{border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
.panel h2{font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.panel p{font-size:13px;line-height:1.5;color:var(--purple)}
.panel p.hi{color:var(--magenta)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw span{font-size:13px;line-height:1.3}

/* nav (design system) */
.nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;width:min(390px,calc(100% - 24px));height:var(--nav-h);
  padding:0 12px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--magenta);border-radius:42px;background:#000}
.nav button{flex:1 1 0;max-width:64px;min-width:0;height:60px;border-radius:30px;border:0;background:transparent;color:var(--purple);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}
.nav button span{font-size:11px;font-weight:400}
.nav button[aria-current="page"]{background:var(--magenta);color:#000}
.nav button[aria-current="page"] span{font-weight:800}
.nav .party{flex:none;width:60px;max-width:60px;border:2px solid var(--magenta);background:#000}
.nav .party[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(223,64,198,.3);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(223,64,198,.12)}}

/* map */
.map{position:absolute;inset:0;touch-action:none;overflow:hidden;cursor:grab;background:#000}
.map:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
#world.anim{transition:transform .35s ease}
#world svg{position:absolute;left:0;top:0;pointer-events:none}
.mk{position:absolute;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;
  transform:translate(-50%,-50%) scale(var(--inv));z-index:2}
.mk i{display:block;width:var(--d,10px);height:var(--d,10px);border-radius:50%;border:2px solid var(--purple);background:#000;transition:width .4s,height .4s,background .4s,border-color .4s}
.mk[data-l="x"]{--d:10px}
.mk[data-l="c"]{--d:8px}.mk[data-l="c"] i{opacity:.4}
.mk[data-l="1"]{--d:14px}.mk[data-l="2"]{--d:17px}.mk[data-l="3"]{--d:20px}.mk[data-l="4"]{--d:24px}.mk[data-l="5"]{--d:28px}
.mk[data-l="1"] i,.mk[data-l="2"] i{background:var(--purple)}
.mk[data-l="3"] i{background:var(--purple);border-color:var(--magenta)}
.mk[data-l="4"] i,.mk[data-l="5"] i{background:var(--magenta);border-color:var(--magenta)}
.mk[aria-pressed="true"]{z-index:5}
.mk[aria-pressed="true"] i{box-shadow:0 0 0 4px rgba(223,64,198,.35),0 0 0 8px #000,0 0 0 10px var(--magenta)}
.mk.here i{animation:pulse 2.4s ease-in-out infinite}
.mk .nm{display:none;position:absolute;padding:4px 10px;border-radius:999px;background:#000;border:1px solid var(--magenta);color:var(--magenta);font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}
.mk.vl .nm{display:block}
.mk.nb .nm{top:calc(100% - 6px);left:50%;transform:translateX(-50%)}
.mk.nt .nm{bottom:calc(100% - 6px);left:50%;transform:translateX(-50%)}
.mk.nr .nm{left:calc(100% - 6px);top:50%;transform:translateY(-50%)}
.mk.nl .nm{right:calc(100% - 6px);top:50%;transform:translateY(-50%)}
.cap{position:absolute;left:14px;top:112px;z-index:10;font-size:10px;color:var(--purple);white-space:nowrap;pointer-events:none;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:10px}
.lm{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%) scale(var(--inv));z-index:1;pointer-events:none;visibility:hidden;color:var(--purple)}
.lm.on{visibility:visible}
.lm .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#000;opacity:.9}
.lm .ic svg{width:16px;height:16px;display:block}
.lm .tx{position:absolute;display:none;padding:3px 8px;border-radius:999px;background:#000;border:1px solid var(--line);font-size:10px;font-weight:800;white-space:nowrap}
.map.labels .lm.on .tx{display:block}
.lm.r .tx{left:100%;margin-left:6px;top:50%;transform:translateY(-50%)}
.lm.l .tx{right:100%;margin-right:6px;top:50%;transform:translateY(-50%)}
.lm.b .tx{top:100%;margin-top:5px;left:50%;transform:translateX(-50%)}
.lm.t .tx{bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%)}
.lm.nolabel .tx{display:none}
.area{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));z-index:1;pointer-events:none;visibility:hidden;color:var(--purple);opacity:.6;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.area.on{visibility:visible}
.ctls{position:absolute;right:12px;top:60px;z-index:10;display:flex;flex-direction:column;gap:8px}
.ctls button{width:44px;height:44px;border-radius:50%;border:2px solid var(--magenta);background:#000;color:var(--magenta);font-size:20px;font-weight:800;cursor:pointer;padding:0;display:grid;place-items:center}
.ctls button:active{border-color:var(--purple);color:var(--purple)}
.layer{position:absolute;left:12px;top:60px;z-index:10;display:inline-flex;padding:3px;border:2px solid var(--purple);border-radius:999px;background:#000}
.layer button{height:34px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--purple);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.layer button[aria-pressed="true"]{background:var(--magenta);color:#000}
#heat circle{transition:r .6s ease}
.dir{border:2px solid var(--magenta);border-radius:28px;background:#000;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.dir .top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}
.dir .x2{width:36px;height:36px;border-radius:50%;border:2px solid var(--magenta);background:#000;color:var(--magenta);font-size:18px;font-weight:800;cursor:pointer;padding:0;display:grid;place-items:center}
.dir .tm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dir .tm b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.dir input[type=range]{width:100%;height:28px;accent-color:#DF40C6;margin:0}
.dir .chips{display:flex;gap:6px}
.dir .chips button{flex:1;min-width:0;height:36px;padding:0 4px;border-radius:999px;border:2px solid var(--purple);background:#000;color:var(--purple);font-size:11px;font-weight:800;cursor:pointer}
.dir p{font-size:11px;line-height:1.3;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir .two{display:flex;gap:8px}
.dir .two .btn{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;margin-bottom:16px;border-radius:999px;border:2px solid var(--purple);background:#000;color:var(--purple);font-size:12px;font-weight:800;cursor:pointer}
.tlist{display:flex;flex-direction:column;gap:16px;padding-bottom:140px}
.tbtn{width:100%;height:64px;padding:0 28px;border:2px solid var(--magenta);border-radius:999px;background:var(--magenta);color:#000;font-size:16px;font-weight:800;letter-spacing:-.01em;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn:active{border-color:var(--purple);background:var(--purple)}
.tmsg{position:absolute;left:12px;right:12px;bottom:calc(var(--nav-h) + 28px);z-index:28;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 12px 12px 24px;min-height:72px;background:var(--purple);border-radius:36px;color:#000}
.tmsg b{font-size:14px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.tmsg button{flex:none;width:48px;height:48px;padding:0;border:0;border-radius:24px;background:#000;color:var(--magenta);display:grid;place-items:center;cursor:pointer}
.slot{position:absolute;left:12px;right:12px;bottom:calc(var(--nav-h) + 28px);z-index:25;display:flex;flex-direction:column;gap:12px}
.banner{border:1px solid var(--magenta);border-radius:28px;background:#000;padding:16px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.banner p{font-size:12px;line-height:1.5}
.offline{position:absolute;left:12px;top:138px;z-index:26;max-width:calc(100% - 80px)}

/* dialogs + toast */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.dlg{width:100%;max-width:456px;max-height:calc(100% - 24px);overflow-y:auto;background:#000;border:2px solid var(--magenta);border-radius:28px;
  padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dlg .b{display:flex;flex-direction:column;gap:12px}
.dlg .b p{font-size:13px;line-height:1.55}
.dlg .b p.dim{color:var(--purple)}
.dlg .b ul{display:flex;flex-direction:column;gap:10px}
.dlg .b li.pt{font-size:13px;line-height:1.5;padding-left:20px;position:relative}
.dlg .b li.pt::before{content:"";position:absolute;left:0;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--purple)}
.dlg .a{display:flex;flex-direction:column;gap:10px}
.dlg .a .btn{width:100%}
.dlg .pick{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;
  max-width:min(440px,calc(100% - 24px));padding:12px 20px;border-radius:999px;background:#000;border:2px solid var(--magenta);
  color:var(--magenta);font-size:12px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.gate .in{width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.gate h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-transform:none}
.gate p{font-size:13px;line-height:1.55;color:var(--purple)}
.gate .btns{display:flex;flex-direction:column;gap:10px;width:100%}
.gate .btns .btn{width:100%}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--purple);border-top-color:var(--magenta);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<noscript><p style="padding:24px">party animals needs javascript to run.</p></noscript>

<div id="app" aria-live="off">
  <header class="hdr">
    <div class="brand" id="brand"></div>
    <button type="button" class="pill" id="demoPill" hidden></button>
  </header>

  <section class="screen" id="screen-map" aria-label="Map">
    <div class="map" id="map">
      <div id="world"></div>
      <div class="cap" id="cap"></div>
      <div class="layer" role="group" aria-label="Map layer"><button type="button" data-layer="live" aria-pressed="true">live now</button><button type="button" data-layer="going" aria-pressed="false">going tonight</button></div>
      <div class="ctls">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zfit" aria-label="Show all venues">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>
        </button>
      </div>
    </div>
    <div class="pill mag offline" id="offline" role="status" hidden>offline · map may be out of date</div>
    <div class="slot" id="slot"></div>
  </section>

  <section class="screen" id="screen-venues" aria-label="Venues" hidden>
    <h1>Venues</h1>
    <div class="field">
      <label for="q">find a spot</label>
      <div class="box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C51F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="venue, barrio or genre" maxlength="40">
        <button type="button" class="clr" id="qclr" aria-label="Clear search" hidden>&times;</button>
      </div>
    </div>
    <ul id="vlist"></ul>
    <p id="vempty" hidden style="font-size:13px;line-height:1.5;color:var(--purple)"></p>
  </section>

  <section class="screen" id="screen-friends" aria-label="Friends" hidden>
    <h1>Friends</h1>
    <div class="card">
      <div class="row"><span class="badge">coming soon</span></div>
      <h3>see where your crew is going</h3>
      <p class="sub">this test is about the live crowd map. friends comes next, once the map proves itself.</p>
    </div>
  </section>

  <section class="screen" id="screen-me" aria-label="Me" hidden>
    <h1>Me</h1>
    <div id="me"></div>
  </section>

  <section class="screen" id="screen-team" aria-label="Team" hidden>
    <button type="button" class="back" id="teamBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>back</button>
    <h1>Team</h1>
    <div class="tlist" id="tlist"></div>
  </section>
  <div class="tmsg" id="tmsg" role="status" hidden><b id="tmsgT"></b><button type="button" id="tmsgX" aria-label="Close message"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DF40C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

  <nav class="nav" id="nav" aria-label="Main"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="gate"></div>

<script>
(() => {
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const BACKEND_LOCAL = true;       // true = nothing leaves this device. Swap Api (below) for Supabase to go live.
const N = 5;                      // k-anonymity: no counts/levels below N people
const WINDOW_MIN = 45;            // crowd = pings in the last 45 min
const PING_TTL_MIN = 120;         // pings deleted after 2 h
const REPING_MS = 5 * 60 * 1000;  // foreground re-check cadence
const MAX_PARTY_MS = 6 * 3600 * 1000;
const MANUAL_PARTY_MS = 60 * 60 * 1000;
const NIGHT_MULT = [0.3, 0.1, 0.2, 0.5, 0.8, 1, 1]; // night starting Sun..Sat (demo only)

/* ============================================================
   SEED VENUES  — PLACEHOLDER DATA. Coordinates are approximate and
   genres/hours are typical guesses. Entry prices are deliberately null.

const rnd = seed => { let t = (seed + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const fmtH = h => { const hh = Math.floor(h) % 24, mm = Math.round((h - Math.floor(h)) * 60); return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0'); };
const hhmm = ts => new Date(ts).toLocaleTimeString('en-GB', {timeZone:'Europe/Madrid', hour:'2-digit', minute:'2-digit'});
function distM(a, b, c, d) {
  const R = 6371000, toR = Math.PI / 180, dLat = (c - a) * toR, dLng = (d - b) * toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*toR) * Math.cos(c*toR) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ============================================================
   TIME (Europe/Madrid, night boundary at 06:00)
   ============================================================ */
const MAD = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const DOW = {Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6};
function madrid() {
  if (S.sim) { const hs = clamp(S.simH, 20, 29.5); return {h: hs % 24, hs, nightDow:6, nightKey:'sim', label:'sat ' + fmtH(hs % 24), sim:true}; }
  try {
    const p = {}; MAD.formatToParts(new Date()).forEach(x => p[x.type] = x.value);
    const h = (+p.hour) + (+p.minute) / 60, dow = DOW[p.weekday], early = h < 6;
    if (isNaN(h) || dow == null) throw new Error('time');
    const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - (early ? 1 : 0)));
    return {h, hs: early ? h + 24 : h, nightDow: early ? (dow + 6) % 7 : dow, nightKey: d.toISOString().slice(0, 10), label: p.hour + ':' + p.minute, sim:false};
  } catch (e) {
    const d = new Date(), h = d.getHours() + d.getMinutes() / 60, early = h < 6;
    return {h, hs: early ? h + 24 : h, nightDow: d.getDay(), nightKey: d.toISOString().slice(0, 10), label: d.toTimeString().slice(0, 5), sim:false};
  }
}

/* ============================================================
   DATA LAYER — the seam for Supabase.
   Live version: submitPing = insert (RLS: insert-only), getCrowd = read the
   `crowd` view (venues with >= N active users). Raw pings are never readable.
   ============================================================ */
const Api = {
  async getCrowd() {
    const now = madrid(), out = new Map(), mult = NIGHT_MULT[now.nightDow];
    const bucket = Math.floor(Date.now() / 120000), gb = Math.floor(Date.now() / 600000), cutoff = Date.now() - WINDOW_MIN * 60000;
    for (const v of VENUES) {
      const [o, c] = v.hours;
      const open = now.hs >= o && now.hs <= c && !(v.type === 'club' && mult < 0.4) && (!v.nights || v.nights.includes(now.nightDow));
      let count = 0;
      if (open && S.demo) {
        const center = v.type === 'club' ? 26.5 : 24.2, sigma = v.type === 'club' ? 2.0 : 2.6;
        const g = Math.exp(-0.5 * ((now.hs - center) / sigma) ** 2);
        count = v.pop * mult * g * (0.88 + 0.24 * rnd(hash(v.id) + bucket));
      }
      if (open) count += S.pings.filter(p => p.venueId === v.id && p.ts >= cutoff).reduce((a, p) => a + (p.source === 'geo' ? 1 : 0.5), 0);
      if (open) count += (S.fake[v.id] || []).filter(f => f.ts >= cutoff).reduce((a, f) => a + f.n, 0);
      let going = 0;
      if (S.demo) going = Math.round(v.pop * mult * 0.5 * (0.9 + 0.2 * rnd(hash(v.id + 'g') + gb)));
      if (S.going.night === now.nightKey && S.going.ids[v.id]) going += 1;
      out.set(v.id, {open, count: Math.floor(count), going});
    }
    return out;
  },
  async submitPing() { if (navigator.onLine === false) throw new Error('offline'); return true; }
};

const levelOf = c => c < N ? null : c < 10 ? 1 : c < 20 ? 2 : c < 35 ? 3 : c < 60 ? 4 : 5;
const LABELS = [null, 'quiet', 'warming up', 'filling up', 'busy now', 'packed'];
function mapStatus(v) {
  if (S.layer === 'going') { const c = S.crowd.get(v.id), L = c ? levelOf(c.going) : null; return {level: L, key: L ? String(L) : 'x', label: L ? 'going: ' + LABELS[L] : 'few going'}; }
  return status(v);
}
function status(v) {
  const c = S.crowd.get(v.id);
  if (!c) return {label:'loading', level:null, key:'x', c:{open:true,count:0,going:0}};
  if (!c.open) return {label:'closed', level:null, key:'c', c};
  const L = levelOf(c.count);
  return L ? {label:LABELS[L], level:L, key:String(L), c} : {label:'no signal', level:null, key:'x', c};
}

  });
  scrim.addEventListener('keydown', e => {
    if (e.key === 'Escape' && dismissible) { e.stopPropagation(); closeDialog(); return; }
    if (e.key === 'Tab') {
      const f = [...box.querySelectorAll('button:not([disabled])')]; if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  if (dismissible) scrim.addEventListener('pointerdown', e => { if (e.target === scrim) closeDialog(); });
  document.body.appendChild(scrim); $('#app').inert = true;
  dlg = {scrim, lastFocus};
  const f = box.querySelector('.pick button, .a button'); if (f) f.focus();
  return box;
}

  if (!dlg) return;

}

const mapEl = $('#map'), world = $('#world');
const PAD = 90, MLAT = 110950, MLNG = 111320 * Math.cos(40.42 * Math.PI / 180);
const pts = VENUES.concat(LANDMARKS);
const minLat = Math.min(...pts.map(p => p.lat)), maxLat = Math.max(...pts.map(p => p.lat));
const minLng = Math.min(...pts.map(p => p.lng)), maxLng = Math.max(...pts.map(p => p.lng));
const PPM = (1000 - 2 * PAD) / ((maxLng - minLng) * MLNG);
const WW = 1000, WH = Math.round((maxLat - minLat) * MLAT * PPM + 2 * PAD);
const proj = (lat, lng) => ({x: PAD + (lng - minLng) * MLNG * PPM, y: PAD + (maxLat - lat) * MLAT * PPM});
const view = {s:1, s0:1, tx:0, ty:0};
const mk = {}, lmEls = [], areaEls = [], vPos = {};

function buildMap() {
  world.style.width = WW + 'px'; world.style.height = WH + 'px';
  const roads = ROADS.map(r => `<polyline points="${r.map(([a, b]) => { const p = proj(a, b); return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ')}" fill="none" stroke="#8C51F6" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const heat = VENUES.map(v => { const p = proj(v.lat, v.lng); return `<circle data-h="${v.id}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="0" fill="#8C51F6" fill-opacity=".28"/>`; }).join('');
  const core = VENUES.map(v => { const p = proj(v.lat, v.lng); return `<circle data-c="${v.id}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="0" fill="#DF40C6" fill-opacity=".5"/>`; }).join('');
  const parks = PARKS.map(k => { const a = proj(k.lat1, k.lng1), b = proj(k.lat2, k.lng2); return `<rect x="${a.x.toFixed(1)}" y="${a.y.toFixed(1)}" width="${(b.x - a.x).toFixed(1)}" height="${(b.y - a.y).toFixed(1)}" rx="24" fill="#8C51F6" fill-opacity=".14"/>`; }).join('');
  world.innerHTML = `<svg width="${WW}" height="${WH}" height="${WH}" viewBox="0 0 ${WW} ${WH}" aria-hidden="true"><defs><filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter></defs>${parks}${roads}<g filter="url(#blur)" id="heat">${heat}${core}</g></svg>`;
  BARRIOS.forEach(l => { const p = proj(l.lat, l.lng), d = document.createElement('div'); d.className = 'area'; d.textContent = l.n; d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; world.appendChild(d); areaEls.push({el: d, p}); });

    <div class="panel"><h2>Demo data</h2>
      <p>the map is empty until enough people check in. demo data fills it with simulated crowds, clearly labeled.</p>
      ${sw('swDemo', 'show demo data', S.demo)}
      ${sw('swSim', 'simulate a saturday night clock', S.sim)}
      <button type="button" class="btn sec" id="meDir">open demo director</button>
    </div>
    <div class="panel"><h2>Your data</h2>
      <p>${BACKEND_LOCAL ? 'in this test version everything stays on this device. nothing is sent anywhere.' : 'we store the venue and the time of a check-in, never your coordinates.'} check-ins are deleted after 2 hours.</p>
      ${store.persistent ? '' : '<p class="hi">your browser is blocking storage, so settings reset when you close this page.</p>'}
      <button type="button" class="btn sec" id="meDel">delete my data</button>
    </div>
    <div class="panel"><h2>Recap</h2>
      <p>${S.recaps.length ? `${S.recaps.filter(r => r.a === 'yes').length} of ${S.recaps.length} answers said the map changed where they went.` : 'no recap answers yet.'}</p>
      <button type="button" class="btn sec" id="meRecap">answer a recap</button>
    </div>
    <div class="panel"><h2>About</h2>
      <p>party animals · mvp 0.1 · madrid · 18+ only. venue details are placeholders until verified on site.</p>
    </div>`;
  $('#meParty').addEventListener('click', () => { if (S.party) endParty('stopped', true); else onPartyButton(); });
  $('#swDemo').addEventListener('click', () => { S.demo = !S.demo; save('demo'); renderMe(); refresh(); });
  $('#meDir').addEventListener('click', openDirector);
  $('#meTeam').addEventListener('click', () => setTab('team'));
  $('#meRecap').addEventListener('click', recapDialog);
  const ss = $('#swSim'); if (ss) ss.addEventListener('click', () => { S.sim = !S.sim; if (!S.sim) stopPlay(); save('sim'); renderMe(); refresh(); });
  $('#meDel').addEventListener('click', () => dialog({
    title: 'delete everything?',
    build: b => { b.innerHTML = '<p>this clears your check-ins, party mode, 18+ confirmation and settings from this device.</p>'; },
    actions: [{label: 'delete my data', kind: 'pri', onClick: wipe}, {label: 'cancel', kind: 'sec'}]
  }));
  updateDemoPill();
}
function wipe() {
  stopWatch(); store.clear();
  S.age = null; S.consent = false; S.party = null; S.going = {night:'', ids:{}}; S.pings = []; S.demo = true; S.sim = false; S.selected = null; S.fake = {}; S.recaps = []; S.simH = 26; S.layer = 'live'; S.dir = false; slotKey = ''; stopPlay();
  toast('data deleted'); updateAll(); setTab('map'); showGate();
}

/* ============================================================
   TEAM PAGE (Sprint 0 name buttons)
   ============================================================ */
const TEAM = ['Ana Luisa Furiati', 'Maha Karthik', 'Ricardo Chavez', 'Arthur Destombes', 'Lydia Waddell', 'Jan Font'];
S.teamSel = null;
function renderTeam() {
  const sel = S.teamSel, open = sel !== null;
  $('#tlist').innerHTML = TEAM.map((n, i) => (!open || i === sel) ? `<button type="button" class="tbtn" data-i="${i}">${esc(n)}</button>` : '').join('');
  $('#tmsg').hidden = !open; if (open) $('#tmsgT').textContent = 'Hola mundoooo - ' + TEAM[sel];
}
$('#tlist').addEventListener('click', e => { const b = e.target.closest('.tbtn'); if (!b) return; S.teamSel = +b.dataset.i; renderTeam(); $('#tmsgX').focus(); });
$('#tmsgX').addEventListener('click', () => { const i = S.teamSel; S.teamSel = null; renderTeam(); const b = $(`#tlist [data-i="${i}"]`); if (b) b.focus(); });
$('#teamBack').addEventListener('click', () => setTab('me'));

/* ============================================================
   DEMO PILL
   ============================================================ */
function updateDemoPill() {
  const p = $('#demoPill'); p.hidden = !(S.demo || S.sim);
  p.textContent = S.sim ? 'demo · ' + madrid().label : 'demo data';
  p.setAttribute('aria-label', 'Demo mode is on. Open demo director');
}
$('#demoPill').addEventListener('click', openDirector);

/* ============================================================
   PARTY MODE: consent → location → venue snap → confirm → pings
   ============================================================ */
let flowToken = 0, watchT = null;
function updatePartyUi() {
  const b = $('#partyBtn'), on = !!S.party;
  b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Party mode on. Open status' : 'Party mode');
  updateMap(); renderSlot(); if (S.tab === 'me') renderMe();
}
function onPartyButton() {
  if (S.age !== true) { showGate(); return; }
  if (S.party) return partyStatus();
  if (!S.consent) return consentDialog();
  locate();
}
function consentDialog() {
  dialog({
    title: 'turn on party mode?',
    build: b => { b.innerHTML = `<ul>
      <li class="pt">we use your location only while party mode is on and the app is open.</li>
      <li class="pt">we match you to the nearest venue and keep only the venue and the time. never your coordinates.</li>
      <li class="pt">check-ins are deleted after 2 hours. you can stop any time.</li>
      ${BACKEND_LOCAL ? '<li class="pt">in this test version everything stays on your device.</li>' : ''}</ul>`; },
    actions: [{label: 'turn on', kind: 'pri', onClick: () => { S.consent = true; save('consent'); locate(); }}, {label: 'not now', kind: 'sec'}]
  });
}
async function getPosition() {
  if (!('geolocation' in navigator)) throw {code: 0};
  try { if (navigator.permissions && navigator.permissions.query) { const st = await navigator.permissions.query({name: 'geolocation'}); if (st.state === 'denied') throw {code: 1}; } }
  catch (e) { if (e && e.code === 1) throw e; }
  return new Promise((res, rej) => { try { navigator.geolocation.getCurrentPosition(res, e => rej({code: e.code}), {enableHighAccuracy: true, timeout: 12000, maximumAge: 15000}); } catch (e) { rej({code: 1}); } });
}
function nearby(pos) {
  const acc = pos.coords.accuracy || 50;
  return VENUES.map(v => ({v, d: distM(pos.coords.latitude, pos.coords.longitude, v.lat, v.lng)}))
    .filter(x => x.d <= x.v.r + Math.min(acc, 60)).sort((a, b) => a.d - b.d).slice(0, 3);
}
async function locate() {
  const token = ++flowToken;
  dialog({title: 'finding you…', dismissible: false,
    build: b => { b.innerHTML = '<div class="spin" role="img" aria-label="Loading"></div><p>checking which venue you are at. this can take a few seconds.</p>'; },
    actions: [{label: 'cancel', kind: 'sec', onClick: () => { flowToken++; }}]});
  let pos;
  try { pos = await getPosition(); } catch (err) { if (token !== flowToken) return; return geoError(err); }
  if (token !== flowToken) return;
  closeDialog(true); handlePosition(pos);
}
function geoError(err) {
  const code = err && err.code, inFrame = window.top !== window.self;
  const T = {
    1: ['location is off', 'party mode needs your location to find your venue. allow it for this site in your browser or phone settings, then try again.' + (inFrame ? ' if you opened this inside a preview, location can be blocked there. open the page directly.' : '')],
    2: ['no location signal', 'we cannot get a fix. step outside or near a window and try again.'],
    3: ['taking too long', 'your phone has not found you yet. try again, or pick your venue yourself.'],
    0: ['location not available', 'this device or browser does not support location. you can still pick your venue yourself.']
  }[code] || ['location problem', 'something went wrong getting your location. try again, or pick your venue yourself.'];
  dialog({title: T[0], build: b => { b.innerHTML = `<p>${esc(T[1])}</p><p class="dim">picking a venue yourself counts a little less and lasts 1 hour.</p>`; },
    actions: [{label: 'try again', kind: 'pri', onClick: locate}, {label: 'pick my venue', kind: 'sec', onClick: pickManual}, {label: 'cancel', kind: 'sec'}]});
}
function handlePosition(pos) {
  const acc = pos.coords.accuracy || 0;
  if (acc > 150) return dialog({title: 'weak location signal', build: b => { b.innerHTML = `<p>your location is only accurate to about ${Math.round(acc)} m, too rough to tell which venue you are at.</p>`; },
    actions: [{label: 'try again', kind: 'pri', onClick: locate}, {label: 'pick my venue', kind: 'sec', onClick: pickManual}, {label: 'cancel', kind: 'sec'}]});
  const near = nearby(pos);
  if (!near.length) {
    const far = Math.min(...VENUES.map(v => distM(pos.coords.latitude, pos.coords.longitude, v.lat, v.lng))) > 5000;
    return dialog({title: far ? "you're not near our venues" : "you're not at a listed venue",
      build: b => { b.innerHTML = `<p>${far ? 'we only cover a few barrios in madrid for now. you can still explore the map.' : 'we could not match you to a venue we know. if you are at one, pick it yourself.'}</p>`; },
      actions: far ? [{label: 'explore the map', kind: 'pri'}] : [{label: 'pick my venue', kind: 'pri', onClick: pickManual}, {label: 'cancel', kind: 'sec'}]});
  }
  if (near.length === 1) {
    const v = near[0].v;
    return dialog({title: `you're at ${v.name}?`, build: b => { b.innerHTML = `<p>${esc(v.barrio)} · ${esc(v.genre)}</p>`; },
      actions: [{label: 'yes, party on', kind: 'pri', onClick: () => beginParty(v.id, 'geo')}, {label: 'not here', kind: 'sec', onClick: pickManual}]});
  }
  dialog({title: 'which one are you at?', build: b => {
      b.innerHTML = '<p class="dim">a few venues are close together.</p><div class="pick"></div>';
      near.forEach(({v}) => { const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'li'; btn.innerHTML = `<span class="ic">${paw(28, 22)}</span><span class="tx"><b>${esc(v.name)}</b><small>${esc(v.barrio)}</small></span>`; btn.addEventListener('click', () => { closeDialog(); beginParty(v.id, 'geo'); }); $('.pick', b).appendChild(btn); });
    }, actions: [{label: 'none of these', kind: 'sec'}]});
}
function pickManual() {
  dialog({title: 'pick your venue', build: b => {
      b.innerHTML = '<p class="dim">only pick where you are right now. manual check-ins count less.</p><div class="pick"></div>';
      VENUES.forEach(v => { const c = S.crowd.get(v.id), closed = c && !c.open; const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'li'; btn.disabled = !!closed;
        btn.innerHTML = `<span class="ic">${paw(28, 22)}</span><span class="tx"><b>${esc(v.name)}</b><small>${esc(v.barrio)}${closed ? ' · closed' : ''}</small></span>`;
        btn.addEventListener('click', () => { closeDialog(); beginParty(v.id, 'manual'); }); $('.pick', b).appendChild(btn); });
    }, actions: [{label: 'cancel', kind: 'sec'}]});
}
function beginParty(id, source) {
  const v = byId(id), c = S.crowd.get(id);
  if (c && !c.open) return dialog({title: `${v.name} is closed`, build: b => { b.innerHTML = `<p>typical opening is around ${fmtH(v.hours[0])}. check back then.</p>`; }, actions: [{label: 'ok', kind: 'pri'}]});
  const t = Date.now();
  S.party = {venueId: id, startedAt: t, lastPing: t, source, misses: 0, errs: 0, expiresAt: t + (source === 'manual' ? MANUAL_PARTY_MS : MAX_PARTY_MS)};
  save('party'); recordPing(id, source); startWatch(); updatePartyUi();
  toast(`party on at ${v.name}`); selectVenue(id, true);
}
function partyStatus() {
  const v = byId(S.party.venueId);
  dialog({title: `party on at ${v.name}`, build: b => { b.innerHTML = `<p>since ${hhmm(S.party.startedAt)}. ${S.party.source === 'manual' ? 'manual check-in, ends after 1 hour.' : 'we re-check your venue every few minutes while the app is open.'}</p>`; },
    actions: [{label: 'stop party mode', kind: 'pri', onClick: () => endParty('stopped', true)}, {label: 'keep going', kind: 'sec'}]});
}
function endParty(reason, quiet) {
  const v = S.party && byId(S.party.venueId); S.party = null; save('party'); stopWatch(); updatePartyUi();
  if (quiet) toast('party mode off');
  else toast({left: v ? `looks like you left ${v.name} · party mode off` : 'party mode off', signal: 'lost your location signal · party mode off', over: "party's over · party mode off", expired: 'check-in ended · party mode off'}[reason] || 'party mode off');
}

/* pings + offline queue */
function recordPing(venueId, source) {
  const cut = Date.now() - PING_TTL_MIN * 60000;
  S.pings = S.pings.filter(p => p.ts >= cut); S.pings.push({venueId, ts: Date.now(), source, sent: false});
  save('pings'); flush(); refresh();
}
async function flush() {
  for (const p of S.pings) { if (p.sent) continue; try { await Api.submitPing(p); p.sent = true; } catch (e) { break; } }
  save('pings');
}
function startWatch() { stopWatch(); watchT = setInterval(tick, 30000); }
function stopWatch() { if (watchT) clearInterval(watchT); watchT = null; }
async function tick() {
  const p = S.party; if (!p) return stopWatch();
  const now = Date.now(), m = madrid();
  if (now > p.expiresAt) return endParty(p.source === 'manual' ? 'expired' : 'over');
  if (!m.sim && m.h >= 7 && m.h < 12) return endParty('over');
  if (document.hidden || now - p.lastPing < REPING_MS) return;
  if (p.source === 'manual') return;
  try {
    const pos = await getPosition(); if (!S.party) return;
    if (nearby(pos).some(x => x.v.id === p.venueId)) { p.misses = 0; p.errs = 0; p.lastPing = Date.now(); save('party'); recordPing(p.venueId, 'geo'); }
    else if (++p.misses >= 2) endParty('left'); else save('party');
  } catch (e) { if (S.party && ++S.party.errs >= 3) endParty('signal'); else save('party'); }
}

/* ============================================================
   GATE (18+)
   ============================================================ */
function showGate() {
  const g = $('#gate');
  if (S.age === true) { g.innerHTML = ''; $('#app').inert = false; return; }
  $('#app').inert = true;
  if (S.age === false) {
    g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="in">${paw(80, 64)}<h1 id="gt">party animals is 18+</h1><p>come back when you are 18 or older.</p></div></div>`;
    return;
  }
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="in">${paw(80, 64)}<h1 id="gt">see where the night is happening</h1>
    <p>a live crowd map of madrid's clubs and bars. party animals is for people 18 and over.</p>
    <div class="btns"><button type="button" class="btn" id="ageYes">i'm 18 or older</button><button type="button" class="btn sec" id="ageNo">i'm under 18</button></div></div></div>`;
  $('#ageYes').addEventListener('click', () => { S.age = true; save('age'); showGate(); if (!store.persistent) toast('your browser blocks storage, so settings will not be saved'); setTab(S.tab); });
  $('#ageNo').addEventListener('click', () => { S.age = false; save('age'); showGate(); });
  $('#ageYes').focus();
}

/* ============================================================
   REFRESH LOOP
   ============================================================ */
function updateAll() { updateDemoPill(); updateMap(); renderSlot(); renderList(false); if (S.tab === 'me') renderMe(); updatePartyUi(); }
async function refresh() {
  try {
    const n = madrid();
    if (S.going.night && S.going.night !== n.nightKey) { S.going = {night: n.nightKey, ids: {}}; save('going'); }
    S.crowd = await Api.getCrowd(); S.lastUpdate = Date.now(); S.refreshFailed = false;
  } catch (e) { if (!S.refreshFailed) toast("couldn't refresh · showing last data"); S.refreshFailed = true; }
  updateAll();
}
function setOnline(on) {
  S.online = on; $('#offline').hidden = on;
  if (on) { flush(); refresh(); } else toast('offline · check-ins will send when you are back');
}
window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); if (S.party) tick(); } });
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
window.addEventListener('error', () => toast('something went wrong · try again'));
window.addEventListener('unhandledrejection', () => toast('something went wrong · try again'));

/* ============================================================
   BOOT
   ============================================================ */
try {
  buildMap(); setTab('map'); sizeMap(false);
  if (S.party) { if (Date.now() > S.party.expiresAt) { S.party = null; save('party'); } else startWatch(); }
  S.pings = S.pings.filter(p => p.ts >= Date.now() - PING_TTL_MIN * 60000); save('pings');
  $('#offline').hidden = S.online;
  showGate(); refresh(); flush();
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;background:#000;color:#DF40C6;padding:24px;z-index:999;font-weight:800">something broke while starting. <button style="margin-top:16px;display:block;height:52px;padding:0 28px;border-radius:999px;border:2px solid #DF40C6;background:#DF40C6;color:#000;font-weight:800" onclick="location.reload()">reload</button></div>');
}
})();
</script>
